[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "Frontend"

[build.environment]
  # GOOGLE_CLIENT_ID is a public OAuth identifier required in frontend code by design;
  # exempt it from secrets scanning so the build is not blocked.
  SECRETS_SCAN_OMIT_KEYS = "GOOGLE_CLIENT_ID"

[dev]
  command = "npm start"
  port = 5000

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

[[redirects]]
  from = "/"
  to = "/01-index.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/02-login.html"
  status = 200

[[redirects]]
  from = "/signup"
  to = "/03-signup.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/04-dashboard.html"
  status = 200

[env]
  [env.production]
    [env.production.context]
      environment = { NODE_ENV = "production" }
