<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Signup — Access Learning Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/signup.css">
</head>

<body>

<div class="card">

  <div class="brand">
    <img src="images/logo.png" class="brand-logo" alt="Access Learning Logo">
    <div>
      <div class="brand-name">Access Learning Platform</div>
      <div class="brand-tagline">Learn tech without confusion</div>
    </div>
  </div>

  <h1 class="heading">Create your account</h1>
  <p class="subtext">Start learning frontend, backend, AI, and tech skills with a clear roadmap.</p>

  <div class="field">
    <label for="name">Full Name</label>
    <div class="input-box">
      <i class="fa-solid fa-user"></i>
      <input type="text" id="name" placeholder="Enter your name">
    </div>
  </div>

  <div class="field">
    <label for="email">Email Address</label>
    <div class="input-box">
      <i class="fa-solid fa-envelope"></i>
      <input type="email" id="email" placeholder="Enter your email">
    </div>
  </div>

  <div class="field">
    <label for="password">Password</label>
    <div class="input-box">
      <i class="fa-solid fa-lock"></i>
      <input type="password" id="password" placeholder="Create a password">
    </div>
  </div>

  <button onclick="signup()">
    Create Account
    <i class="fa-solid fa-arrow-right"></i>
  </button>

  <div class="signup-row">
    Already have an account? <a href="02-login.html">Login</a>
  </div>

</div>

<script src="js/signup.js"></script>

</body>
</html>
