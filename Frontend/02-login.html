<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login — Access Learning Platform</title>

<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="card">

  <div class="brand">

    <img src="images/logo.png" class="brand-logo" alt="Logo">

    <div>
      <div class="brand-name">Access Learning Platform</div>
      <div class="brand-tagline">Learn tech without confusion</div>
    </div>

  </div>

  <h1 class="heading">Welcome Back</h1>

  <p class="subtext">
    Login to continue your learning journey and access premium tech resources.
  </p>

  <div class="field">

    <label>Email Address</label>

    <div class="input-box">
      <i class="fa-solid fa-envelope"></i>

      <input 
        type="email" 
        id="email" 
        placeholder="Enter your email"
      >
    </div>

  </div>

  <div class="field">

    <label>Password</label>

    <div class="input-box">
      <i class="fa-solid fa-lock"></i>

      <input 
        type="password" 
        id="password" 
        placeholder="Enter your password"
      >
    </div>

  </div>

  <button onclick="login()">
    Login
    <i class="fa-solid fa-arrow-right"></i>
  </button>

  <div class="divider">
    OR CONTINUE WITH
  </div>

  <div class="google-box">
    <div id="googleBtn"></div>
  </div>

  <div class="signup-row">
    Don’t have an account?
    <a href="03-signup.html">Create Account</a>
  </div>

</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script src="js/login.js"></script>

</body>
</html>
